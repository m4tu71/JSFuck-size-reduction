name: Python encoder tests
on:
  push:
    branches: [feat/python-encoder-benchmark]
  pull_request:
    paths:
      - "jsfuck_py/**"
      - "tests/**"
      - ".github/workflows/python-tests.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --no-deps .
      - run: python -c "import jsfuck_py; from importlib.metadata import version; assert version('jsfuck-size-reduction') == jsfuck_py.__version__"
      - run: python -m unittest discover -s tests -v
      - run: python -m jsfuck_py.benchmark
      - run: python -m jsfuck_py.benchmark --wrap
      - run: python -m jsfuck_py.benchmark --cases benchmarks/javascript_samples.json
      - run: python -m jsfuck_py.benchmark --cases benchmarks/javascript_samples.json --wrap
      - run: python -m benchmarks.ablation
      - run: python -m benchmarks.ablation --cases benchmarks/native_suffix_cases.json
      - run: python -m benchmarks.typed_ablation
      - run: python -m benchmarks.typed_ablation --cases benchmarks/typed_primitive_cases.json
      - run: python -m benchmarks.typed_ablation --cases benchmarks/typed_primitive_cases.json --wrap
      - run: python -m jsfuck_py.benchmark --cases benchmarks/repetition_cases.json
      - run: python -m benchmarks.repetition_ablation
      - run: python -m benchmarks.repetition_ablation --cases benchmarks/javascript_samples.json
      - run: python -m jsfuck_py.benchmark --cases benchmarks/numeric_batch_cases.json
      - run: python -m jsfuck_py.benchmark --cases benchmarks/long_unicode_cases.json
      - run: python -m benchmarks.numeric_batch_ablation
      - run: python -m benchmarks.numeric_batch_ablation --cases benchmarks/numeric_batch_cases.json
      - run: python -m benchmarks.shared_substring_ablation
      - run: python -m benchmarks.generated_expression_cse
      - run: python -m benchmarks.segment_generator_ablation
      - run: python -m benchmarks.segment_generator_ablation --cases benchmarks/javascript_samples.json
      - run: python -m benchmarks.generator_segmentation_study
